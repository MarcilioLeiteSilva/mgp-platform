name: mgp-local-dev

services:
  # ==========================================
  # Banco de Dados Transacional (PostgreSQL 16)
  # ==========================================
  mgp-postgres:
    image: postgres:16-alpine
    container_name: mgp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgp_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-mgp_db}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mgp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Cache, Filas e Pacing em Memória (Redis 7)
  # ==========================================
  mgp-redis:
    image: redis:7-alpine
    container_name: mgp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-mgp_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mgp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mgp_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Armazenamento de Objetos (MinIO - S3 Compatível)
  # ==========================================
  mgp-minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: mgp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mgp_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mgp_minio_password123}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console Web UI
    volumes:
      - minio_data:/data
    networks:
      - mgp-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # ClickHouse (Analytics massivo de telemetria)
  # ==========================================
  mgp-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: mgp-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mgp_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mgp_clickhouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP Client
      - "9000:9000" # Native TCP Client (mapeada para 9002 se conflitar com MinIO)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - mgp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  mgp-network:
    driver: bridge
    name: mgp-network

volumes:
  postgres_data:
    name: mgp_postgres_data
  redis_data:
    name: mgp_redis_data
  minio_data:
    name: mgp_minio_data
  clickhouse_data:
    name: mgp_clickhouse_data
